<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
</head>
<body>
    <img width = "230" src="image.png" alt="Mosque Image">
    
    <br>

    <table>
        <caption>Masjid in Bangalore</caption>
        <tr>
            <th>Name</th>
            <th>Location</th>
        </tr>

        <tr>
            <td colspan = "2">Masjid-e-Bilal</td>
            <td>BTM Layout</td>
        </tr>
    </table>
    <h3>Example of Unordered list</h3>
    <ul type = "square">
        <li>Tafazzul</li>
        <li>Maaz</li>
        <li>Anas</li>
    </ul>
    <h3>Example of Ordered list</h3>
    <ol>
        <li>Tafazzul</li>
        <li>Maaz</li>
        <li>Anas</li>
    </ol>
</body>
</html>
